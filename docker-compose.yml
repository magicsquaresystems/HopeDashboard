# One-command local/self-host stack: risk service + comment service + dashboard.
#
#   docker compose up --build
#
# Prereqs:
#   * Sibling checkouts: ../engagement_ml and ../comment_generation
#   * engagement_ml model bundles present at ../engagement_ml/models/
#     (winner_T{7..56}.pkl, platt_T{7..56}.pkl, feature_*.csv,
#     model_card_*.json — forty files, ~12 MB; gitignored on GitHub.
#     Fetch from the private model repo with a read-scoped HF token:
#       python -c "from huggingface_hub import snapshot_download; \
#         snapshot_download('h4cdev/hope-move-engagement-ml', local_dir='../engagement_ml/models')")
#   * Copy .env.example to .env and fill the secrets.
#
# Modes:
#   * CPU stub demo (no model download, instant):
#       HOPE_DISABLE_GENERATION=1 docker compose up --build
#   * CPU real generation (slow, ~30-80 s per draft): default
#   * GPU: uncomment the `deploy:` block under comment-api (needs NVIDIA
#     Container Toolkit)
services:
  risk-api:
    build:
      context: ../engagement_ml
      dockerfile: deploy/Dockerfile
    container_name: hope-risk-api
    ports: ["8000:8000"]
    environment:
      API_KEY: ${HOPE_RISK_API_KEY:-dev-key-change-me}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
    volumes:
      # Bundles are mounted, not baked — see prereqs above.
      - ../engagement_ml/models:/app/deploy/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  comment-api:
    build:
      context: ../comment_generation
      dockerfile: Dockerfile.api
    container_name: hope-comment-api
    ports: ["8001:8001"]
    environment:
      HOPE_API_SECRET: ${HOPE_API_SECRET:-dev-secret}
      HOPE_API_AUTH: ${HOPE_API_AUTH:-disabled}
      HOPE_GEN_MODEL_ID: ${HOPE_GEN_MODEL_ID:-h4cdev/qwen3.5-4b-hope-forum-lora}
      # Needed to snapshot_download private adapters from the Hub.
      HF_TOKEN: ${HF_TOKEN:-}
      HOPE_DROPOUT_URL: http://risk-api:8000/health
      HOPE_DASHBOARD_ORIGIN: ${HOPE_DASHBOARD_ORIGIN:-http://localhost:3000}
      # Optional engagement-fingerprint panel; generation degrades
      # gracefully (engagement_used: false) when the file is absent.
      HOPE_DROPOUT_PANEL_PATH: /data/dropout_artifacts/cumulative_features_panel.parquet
      # Set to 1 for the CPU stub demo (no model load, canned drafts).
      HOPE_DISABLE_GENERATION: ${HOPE_DISABLE_GENERATION:-}
      # Point at a vLLM server to serve decodes from it instead of loading
      # weights in this container. Empty = in-process transformers (default).
      # Set to http://vllm:8000 to use the profiled `vllm` service below.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
    volumes:
      - ../comment_generation/models:/app/models:ro
      - ../comment_generation/outputs:/app/outputs
      - ../engagement_ml/outputs/artifacts:/data/dropout_artifacts:ro
      - hf-cache:/root/.cache/huggingface
    depends_on:
      risk-api:
        condition: service_started
    healthcheck:
      # The CUDA image has no wget/curl; python3 is always present.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Uncomment to use a CUDA GPU for the SLM:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  # Optional high-concurrency backend. Off unless explicitly requested:
  #
  #   docker compose --profile vllm up --build
  #
  # then set VLLM_BASE_URL=http://vllm:8000 so comment-api routes decodes here.
  #
  # Why bother: the in-process backend serves one decode at a time behind a
  # lock, so beyond `1 + HOPE_GEN_MAX_QUEUE` callers are refused with a 503.
  # Measured, 20 simultaneous drafts came back as 4 served and 16 refused.
  # Through vLLM the same 20 were all served in under 10 s.
  #
  # Needs a **merged** checkpoint. vLLM cannot load the DoRA adapter the
  # transformers path uses — build one with
  # `comment_generation/scripts/merge_adapter.py`, which also fixes the
  # Qwen3.5 key layout vLLM rejects, and set VLLM_MODEL to its path or Hub id.
  #
  # Requires the NVIDIA Container Toolkit and roughly 16 GB of VRAM for the 4B
  # in fp16 plus KV cache.
  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:latest
    container_name: hope-vllm
    ports: ["8000:8000"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL:-h4cdev/qwen3.5-4b-hope-forum}
      --served-model-name ${HOPE_GEN_MODEL_ID:-h4cdev/qwen3.5-4b-hope-forum-lora}
      --max-model-len 4096
      --gpu-memory-utilization 0.85
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=3)"]
      # start_period is generous: the first request also pays CUDA-graph
      # warmup, measured at ~37 s against ~2 s once warm.
      start_period: 180s
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
    container_name: hope-dashboard
    ports: ["3000:3000"]
    environment:
      COMMENT_GEN_URL: http://comment-api:8001
      DROPOUT_API_URL: http://risk-api:8000
      HOPE_API_SECRET: ${HOPE_API_SECRET:-dev-secret}
      HOPE_RISK_API_KEY: ${HOPE_RISK_API_KEY:-dev-key-change-me}
      AUTH_SECRET: ${AUTH_SECRET:-dev-auth-secret}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      # Sign-in is platform hand-off only; this verifies the token
      # signature. Falls back to AUTH_SECRET (matching handoff.ts) so the
      # stack works out of the box with links from mint-handoff-token.mjs.
      HOPE_HANDOFF_SECRET: ${HOPE_HANDOFF_SECRET:-${AUTH_SECRET:-dev-auth-secret}}
      # "open" shows every cohort to any signed-in facilitator — right
      # for local dev. Production runs "allowlist" (deny until assigned).
      AUTH_MODE: ${AUTH_MODE:-open}
    depends_on:
      - comment-api
      - risk-api

volumes:
  hf-cache: {}
